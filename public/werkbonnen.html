<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e8449">
<title>Werkbonnen</title>
<style>
:root{
  /* Standaard de huisstijl van KZ Kasherstel (groen + magenta, kzkasherstel.nl); Lijsten > Bedrijven kan dit per aannemer overschrijven. */
  --blauw:#2e8449; --blauw-licht:#dcf0e3; --bg:#f1f9f4; --kaart:#fff; --tekst:#14201b; --grijs:#40514a; --lijn:#b9d3c2;
  --blauw-diep:#1f5c35; --rood:#a8341f; --oranje:#e08a12; --oranje-diep:#9c5c06; --groen:#c40069; --groen-licht:#2f7d55;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tekst);font-size:19px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
#topbar{position:sticky;top:0;z-index:30;background:var(--blauw);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px}
#topbar h1{font-size:21px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .wie{font-size:15px;font-weight:600;cursor:pointer}
#tabs{position:sticky;top:46px;z-index:29;display:flex;flex-wrap:wrap;background:var(--kaart);border-bottom:1px solid var(--lijn)}
#tabs button{flex:1 0 auto;min-width:92px;padding:13px 14px;font-size:17px;font-weight:600;color:var(--grijs);border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.actief{color:var(--blauw);border-bottom-color:var(--blauw);font-weight:600}
#tabs button .bol{display:inline-block;min-width:20px;padding:1px 5px;border-radius:10px;background:var(--rood);color:#fff;font-size:15px;margin-left:3px}
main{padding:12px;max-width:1100px;margin:0 auto;padding-bottom:60px}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:10px;padding:12px;margin-bottom:10px}
.kaart h2{font-size:21px;margin-bottom:10px;color:var(--blauw)}
.kaart h3{font-size:18px;margin:14px 0 6px;color:var(--blauw)}
.regel{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--lijn);flex-wrap:wrap}
.regel:last-child{border-bottom:none}
.stil{color:var(--grijs);font-size:15px}
.knop{background:var(--blauw);color:#fff;padding:13px 18px;border-radius:9px;font-size:18px;font-weight:600;white-space:nowrap}
.knop.licht{background:var(--blauw-licht);color:var(--blauw-diep)}
.knop.rood{background:var(--rood)}
.knop.groen{background:var(--groen)}
.knop.klein{padding:8px 13px;font-size:16px}
.prijsvast{display:block;padding:9px 2px;font-weight:600;white-space:nowrap}.prijsvast small{font-weight:600;font-size:13px;color:var(--blauw-diep);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:4px}
.knop.breed{width:100%;text-align:center;white-space:normal}
/* Uit beeld, maar wel aanwezig: het kale bestandsveld wordt bediend via een knop. */
.weg{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;border:0;padding:0}
.knop:disabled{opacity:.55;cursor:default}
.rij{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.rij>label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600;color:var(--grijs);flex:1;min-width:170px}
input[type=date],input[type=text],input[type=number],input[type=password],select,textarea{border:1px solid #9fbfab;border-radius:8px;padding:12px;background:#fff;font-size:19px;max-width:100%;width:100%}
textarea{min-height:60px;resize:vertical}
.chip{display:inline-block;padding:4px 11px;border-radius:12px;font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
.st-concept{background:#5a6b7d}.st-ingediend{background:var(--oranje-diep)}.st-goedgekeurd{background:var(--groen-licht)}.st-afgekeurd{background:var(--rood)}.st-gefactureerd{background:var(--blauw)}
.st-definitief{background:var(--groen)}.st-geexporteerd{background:#5a3f80}
.bedrag{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bonregel{display:grid;grid-template-columns:minmax(160px,2fr) 84px 84px 98px 108px 38px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--lijn)}
.bonregel input,.bonregel select{padding:6px}
.bonregel .lbl{font-size:14px;font-weight:600;color:var(--grijs);display:block}
.bonregel .x{color:var(--rood);font-size:22px;text-align:center}
.bonregel.uitgelezen{background:#fff8e6;border-left:3px solid var(--oranje);padding-left:6px}
@media(max-width:640px){.bonregel{grid-template-columns:1fr 1fr 1fr;} .bonregel .oms{grid-column:1/-1} .bonregel .bedrag{grid-column:1/3} .bonregel .x{grid-column:3}}
.bonregel.vast{background:var(--blauw-licht);border-radius:6px;padding-left:6px}
.bonregel .vastlbl{font-size:17px}
.shift{border:1px solid var(--lijn);border-radius:10px;padding:10px;margin:10px 0;background:#fafcfb}
.shiftkop{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:19px}
.shiftkop b{flex:1}
.shiftkop .x,.vrt .x{color:var(--rood);font-size:24px;padding:0 8px}
.tijden label{min-width:112px;flex:0 1 142px}
.tijden .uren{font-size:23px;font-weight:700;padding:6px 0}
.wolk{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.wolk .naam{border:1px solid #9fbfab;border-radius:22px;padding:10px 16px;font-size:18px;background:#fff;color:var(--tekst);min-height:46px}
.wolk .naam.aan{background:var(--blauw);color:#fff;border-color:var(--blauw);font-weight:600}
.wolk .naam.nieuw{border-style:dashed;color:var(--blauw)}
#nk-wolk{max-height:48vh;overflow:auto}
.wolk .naam.check{border-color:var(--oranje-diep);background:#fff2d6}
.wolk .naam.check.aan{background:var(--oranje-diep);border-color:var(--oranje-diep)}
.controle{border:1px solid var(--lijn);border-radius:10px;padding:10px;margin-top:10px;background:#fafcfb}
.wolk .naam:disabled{opacity:.75;cursor:default}
.schakel{display:flex;align-items:center;gap:6px;padding:6px 0;color:var(--tekst)}
.schakel input[type=checkbox]{width:28px;height:28px}
.vrt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border:1px solid var(--lijn);border-radius:10px;margin-top:8px;background:#fafcfb}
.vrt b{min-width:110px}
.vrt label{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--grijs)}
.vrt label input,.vrt label select{width:110px;padding:9px}
.seg{display:inline-flex;border:1px solid var(--blauw);border-radius:8px;overflow:hidden}
.seg button{padding:9px 15px;font-size:17px;font-weight:600;color:var(--blauw);background:#fff}
.seg button.aan{background:var(--blauw);color:#fff;font-weight:600}
.afspraak{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--lijn);font-size:17px}
.afspraak .pm{display:inline-flex;align-items:center;gap:4px}
.afspraak .pm button{width:38px;height:38px;border-radius:8px;background:var(--blauw-licht);color:var(--blauw-diep);font-size:20px;font-weight:700}
.afspraak .pm input{width:94px;padding:8px;text-align:right}
.sheetkaart h3{font-size:18px;margin:14px 0 4px;color:var(--blauw)}
.sectie{margin-top:12px;border-top:2px solid var(--blauw-licht);padding-top:6px}
.sectie .kop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.sectie .kop b{font-size:18px}
.totaal{display:flex;justify-content:space-between;font-weight:700;font-size:22px;padding:10px 0;border-top:2px solid var(--blauw)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;align-items:flex-end;justify-content:center}
.sheetkaart{background:#fff;border-radius:14px 14px 0 0;padding:14px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.sheettitel{font-weight:700;font-size:21px;margin-bottom:10px}
.sheetrij{display:flex;gap:8px;margin-top:10px;align-items:center}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14201b;color:#fff;padding:11px 16px;border-radius:8px;font-size:18px;display:none;z-index:50;max-width:90vw}
#login{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#login .kaart{width:100%;max-width:380px}
#login label{display:block;margin-bottom:12px;font-size:17px;font-weight:600;color:var(--grijs)}
canvas.sig{border:1px dashed #6d7d75;border-radius:8px;background:#fff;width:100%;height:150px;touch-action:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{height:64px;border-radius:6px;border:1px solid var(--lijn)}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-7px;right:-7px;background:var(--rood);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;text-align:center}
table.lijst{width:100%;border-collapse:collapse;font-size:17px}
table.lijst th,table.lijst td{padding:9px 6px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top}
table.lijst th{color:var(--grijs);font-weight:700;font-size:14px;text-transform:uppercase}
table.lijst tr.klik{cursor:pointer}
table.lijst tr.klik:hover{background:var(--blauw-licht)}
.scroll{overflow-x:auto}
/* KZ-achtige overzicht/factuur-opmaak */
.doc{background:#fff;color:#000;padding:22px;max-width:800px;margin:0 auto;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;border:1px solid var(--lijn)}
.doc .kopblok{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.doc .kopblok .firma{font-size:20px;font-weight:700;color:var(--blauw);font-family:Georgia,'Times New Roman',serif;letter-spacing:.02em}
.doc .kopblok .firma small{display:block;font-size:12px;font-weight:400;color:#2b2b2b}
.doc h1{font-size:18px;margin:0 0 4px}
.doc .meta{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 12px;font-size:13.5px}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc th{text-align:left;border-bottom:1px solid #000;padding:5px 3px;font-size:12.5px}
.doc td{padding:4px 3px;vertical-align:top}
.doc tr.dag td{font-weight:700;padding-top:9px;border-bottom:1px solid #777}
.doc tr.sec td{font-weight:700;padding-top:12px;border-bottom:1px solid #777}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc tr.tot td{font-weight:700;border-top:2px solid #000;padding-top:6px;font-size:15px}
.doc .adres{margin:14px 0}
.doc .voet{margin-top:22px;font-size:12px;color:#2b2b2b;border-top:1px solid #777;padding-top:6px}
.doc .fmeta{display:flex;gap:26px;margin:12px 0}
.doc .fmeta div b{display:block;font-size:12px;color:#2b2b2b}
.knoppen{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
pre.xml{background:#f6f8fa;border:1px solid var(--lijn);border-radius:8px;padding:10px;font-size:13px;overflow:auto;max-height:50vh;white-space:pre-wrap;word-break:break-all}
.waarsch{background:#fff2d6;border:1px solid var(--oranje-diep);border-radius:8px;padding:12px 14px;font-size:18px;margin-bottom:10px}
.info{background:var(--blauw-licht);border-radius:8px;padding:12px 14px;font-size:18px;margin-bottom:10px}
.badge-week{display:inline-block;background:var(--blauw-licht);color:var(--blauw-diep);border-radius:6px;padding:4px 10px;font-size:15px;font-weight:600}
@media print{
  body{background:#fff}
  #topbar,#tabs,.knoppen,.noprint,#toast,#sheet{display:none!important}
  main{padding:0;max-width:none}
  .doc{border:none;max-width:none;padding:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div id="login">
  <div class="kaart">
    <img id="lg-logo" alt="KZ Kasherstel" style="height:52px;max-width:100%;object-fit:contain;display:block;margin-bottom:4px">
    <div style="font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--grijs);font-weight:700;margin-bottom:12px">Werkbonnen</div>
    <label>Jouw naam<br><input type="text" id="lg-wie" autocomplete="name"></label>
    <label>Toegangscode<br><input type="password" id="lg-code" autocomplete="current-password"></label>
    <div class="stil" id="lg-fout" style="color:var(--rood);min-height:16px"></div>
    <button class="knop breed" id="lg-ok" style="margin-top:8px">Inloggen</button>
  </div>
</div>
<div id="topbar"><h1>📋 Werkbonnen</h1><span class="wie" id="tb-wie"></span></div>
<div id="tabs"></div>
<main id="app"></main>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
const API = (location.search.match(/[?&]api=([^&]+)/) ? decodeURIComponent(RegExp.$1) : 'https://hlgvtxcwbhrbbcozvsen.supabase.co/functions/v1/werkbonnen/api');
const CATS = [
  {id:'arbeid', naam:'Arbeid', n:'man', per:'uur', tot:'per uur'},
  {id:'km', naam:'Kilometervergoeding', n:"auto's", per:'km.', tot:'per km.'},
  {id:'overnachting', naam:'Overnachtingsvergoeding', n:'', per:'', tot:'per nacht'},
  {id:'materieel', naam:'Materieel', n:'', per:'', tot:'per dag'},
  {id:'transport', naam:'Transport', n:'', per:'', tot:'per uur'},
  {id:'materiaal', naam:'Diversen (materiaal)', n:'', per:'', tot:'per stuk'},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const STATUS_TXT = {concept:'concept', ingediend:'ingediend', goedgekeurd:'goedgekeurd', afgekeurd:'afgekeurd', gefactureerd:'gefactureerd', definitief:'definitief', geexporteerd:'geëxporteerd'};
const DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

const S = { data:null, tab:'bon', bon:null, code:localStorage.getItem('wb_code')||'', wie:localStorage.getItem('wb_wie')||'',
  lijstStatus:'', lijstProject:'', ovProject:null, ovJaar:null, ovWeek:null, ovAlleenGoed:true, factId:null, factXml:null, nieuwFact:null, lijstTab:'tarieven' };

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function r2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function num(v){ const n=Number(String(v==null?'':v).replace(',','.')); return Number.isFinite(n)?n:0; }
// KZ rekent zoals hun Excel: regelbedragen (totaal x prijs) onafgerond optellen, pas het eindtotaal op centen afronden.
function somExact(regels){ let c=0; for(const r of regels) c+=Math.round(num(r.totaal)*100)*Math.round(num(r.prijs)*100); return Math.sign(c)*Math.floor((Math.abs(c)+50)/100)/100; }
function fmtGeld(n){ return Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function fmtNum(n, dec){ const x=Number(n||0); if(dec==null){ return Number.isInteger(x)?String(x):x.toLocaleString('nl-NL',{maximumFractionDigits:2}); } return x.toLocaleString('nl-NL',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function vandaagISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(iso){ const p=String(iso).slice(0,10).split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function iso(d){ return d.toISOString().slice(0,10); }
function fmtDatum(isoS){ const d=pd(isoS); return DAGEN[d.getUTCDay()]+' '+d.getUTCDate()+' '+MAANDEN[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
function fmtKort(isoS){ if(!isoS) return '—'; const d=pd(isoS); return String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear(); }
function fmtDMY(isoS){ const d=pd(isoS); return d.getUTCDate()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCFullYear(); }
function isoWeek(isoS){ const d=pd(isoS); const dag=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dag); const js=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return {jaar:d.getUTCFullYear(), week:Math.ceil((((d-js)/86400000)+1)/7)}; }
function weekMaandag(jaar, week){ const j4=new Date(Date.UTC(jaar,0,4)); const dow=j4.getUTCDay()||7; j4.setUTCDate(j4.getUTCDate()-(dow-1)+(week-1)*7); return j4; }
function dagType(isoS){ const d=pd(isoS).getUTCDay(); return d===0?'zo':d===6?'za':'ma-vr'; }
function chip(st){ return '<span class="chip st-'+esc(st)+'">'+esc(STATUS_TXT[st]||st)+'</span>'; }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',3200); }
function project(id){ return (S.data.projecten||[]).find(p=>p.id===id); }
function bedrijf(id){ return (S.data.bedrijven||[]).find(b=>b.id===id); }
function regelsVan(bonId){ return (S.data.regels||[]).filter(r=>r.bon_id===bonId).sort((a,b)=>a.sort-b.sort); }
function bonTotaal(bonId){ return somExact(regelsVan(bonId)); }
function bonnenTotaal(ids){ return somExact((S.data.regels||[]).filter(r=>ids.includes(r.bon_id))); }
function isAdmin(){ return S.data && S.data.rol==='admin'; }
// De werkvloer vult alleen in wat er gewerkt, gebruikt en verbleven is: geen tarieven of bedragen in beeld.

// Huisstijl van de aannemer (Lijsten > Bedrijven): hoofdkleur, tweede kleur en logo bepalen de uitstraling van app, overzicht en factuur.
function huisstijl(b){
  const r=document.documentElement.style; const k=b&&/^#[0-9a-f]{6}$/i.test(b.kleur||'')?b.kleur:''; const k2=b&&/^#[0-9a-f]{6}$/i.test(b.kleur2||'')?b.kleur2:'';
  if(k){ const kd=leesbaar(k,4.6); r.setProperty('--blauw',kd); r.setProperty('--blauw-diep',leesbaar(k,6.5)); r.setProperty('--blauw-licht',mengKleur(kd,'#ffffff',0.87)); r.setProperty('--bg',mengKleur(kd,'#ffffff',0.94)); document.querySelector('meta[name=theme-color]').content=kd; }
  else { for(const n of ['--blauw','--blauw-diep','--blauw-licht','--bg']) r.removeProperty(n); }
  if(k2) r.setProperty('--groen',leesbaar(k2,4.6)); else r.removeProperty('--groen');
}
// Een huisstijlkleur die er op een beeldscherm mooi uitziet, kan te licht zijn voor witte letters - en dan leest niemand het
// nog in een kas vol licht. We verdonkeren zo'n kleur net zo lang tot het contrast klopt; de kleur blijft herkenbaar.
function witContrast(hex){ const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(x=>x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4)); return 1.05/(0.2126*v[0]+0.7152*v[1]+0.0722*v[2]+0.05); }
function leesbaar(hex, doel){ let h=hex; for(let i=0;i<60&&witContrast(h)<doel;i++) h=mengKleur(h,'#000000',0.06); return h; }
function mengKleur(a,b,f){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const [x,y]=[p(a),p(b)]; return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*f).toString(16).padStart(2,'0')).join(''); }
function logoHtml(b, h){ const src=bedrijfLogo(b); return src?'<img src="'+esc(src)+'" alt="'+esc((b&&b.naam)||'')+'" style="height:'+(h||44)+'px;max-width:240px;object-fit:contain;display:block;margin-bottom:6px">':''; }
// Staat het woordmerk er al, dan hoeft de naam niet nog eens groot: die zakt naar de regel met het adres.
function firmaNaam(b){ return bedrijfLogo(b)?'':esc((b&&b.naam)||''); }
function firmaNaamKlein(b){ return bedrijfLogo(b)?esc((b&&b.naam)||'')+'<br>':''; }

async function api(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-code':S.code},body:JSON.stringify(Object.assign({wie:S.wie},body))});
  if(r.status===401) throw {auth:true};
  let j=null; try{ j=await r.json(); }catch(x){}
  if(!r.ok) throw new Error((j&&j.fout)||'serverfout');
  return j;
}
async function laad(){ S.data=await api({action:'state'}); }
async function doe(actie, logtekst){
  try{ const j=await api(Object.assign({},actie,{log:logtekst||''})); await laad(); render(); return j; }
  catch(e){ toast(e.auth?'Niet ingelogd':(e.message||'Opslaan mislukt — check je verbinding')); return null; }
}

/* ---------- dagbon ---------- */
// Invoer op de werkvloer: shifts (start/eind + namenwolk + overnachting), voertuigen/materieel (op locatie of gebracht, dagdeel)
// en eventueel extra regels. Uit de invoer worden de bonregels afgeleid (bron 'shift' / 'voertuig'); extra regels hebben bron 'extra'.
// Afrondingsregels: mensen heel (naar boven), uren per 0,5, km per 0,5, nachten heel, dagdeel per 0,25, prijzen per 0,25.
function tarieven(cat){ return (S.data.tarieven||[]).filter(t=>t.actief&&t.categorie===cat); }
function arbeidTarief(datum){ const dt=dagType(datum); const ts=tarieven('arbeid'); return ts.find(t=>t.dagtype===dt)||ts.find(t=>t.dagtype==='alle')||ts[0]||null; }
function isVeelvoud(v,stap){ const q=num(v)/stap; return Math.abs(q-Math.round(q))<1e-6; }
function rondAf(v,stap){ return r2(Math.round(num(v)/stap)*stap); }
function stapAantal(r){ return r.categorie==='transport'?0.5:1; }
function stapPer(r){ const e=String(r.eenheid_per||'').toLowerCase(); return e==='uur'?0.5:/^km/.test(e)?0.5:e==='dag'?0.25:1; }
function heelAantal(r){ return stapAantal(r)===1; }
function heelPer(r){ return stapPer(r)===1; }
function regelFout(r){
  if(!isVeelvoud(r.aantal,stapAantal(r))) return heelAantal(r)?'Aantal '+(r.eenheid_n||'')+' moet een heel getal zijn (geen halve '+(r.eenheid_n==='man'?'mannen':r.eenheid_n||'aantallen')+')':'Uren moeten in halve uren zijn';
  if(r.per!=null&&!isVeelvoud(r.per,stapPer(r))) return (r.eenheid_per||'per')+(heelPer(r)?' moet een heel getal zijn':' moet in stappen van '+fmtNum(stapPer(r))+' zijn');
  return '';
}
function tijdMin(t){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m?(+m[1])*60+(+m[2]):null; }
function shiftPauze(sh){ if(sh.pauze!==''&&sh.pauze!=null&&sh.pauze!=='auto') return num(sh.pauze); const a=tijdMin(sh.start), b=tijdMin(sh.eind); if(a==null||b==null) return 0; let u=(b-a)/60; if(u<0) u+=24; return u>=6?0.5:0; }
function shiftUren(sh){ const a=tijdMin(sh.start), b=tijdMin(sh.eind); if(a==null||b==null) return 0; let u=(b-a)/60; if(u<0) u+=24; u-=shiftPauze(sh); return Math.max(0, rondAf(u,0.5)); }
function medewerker(id){ return (S.data.medewerkers||[]).find(m=>m.id===id); }
function naamVan(id){ const m=medewerker(id); return m?m.naam:''; }
// Ploeg: aantal_man (eerst invullen) + leden (medewerker-ids uit de namenwolk). Oude bonnen hadden namen als tekst + extra_man: die worden omgezet.
function normShift(s){ const legacy=!Array.isArray((s||{}).leden); const sh=Object.assign(nieuweShift(),s||{});
  if(legacy){ const ids=[]; for(const nm of (sh.namen||[])){ const m=(S.data.medewerkers||[]).find(m=>m.naam.toLowerCase()===String(nm).toLowerCase()); if(m) ids.push(m.id); } sh.leden=ids; if((s||{}).aantal_man==null||(s||{}).aantal_man==='') sh.aantal_man=(sh.namen||[]).length+Math.ceil(num(sh.extra_man)-1e-9); }
  sh.leden=[...new Set(sh.leden.map(Number).filter(id=>medewerker(id)))]; sh.aantal_man=Math.max(Math.ceil(num(sh.aantal_man)-1e-9),sh.leden.length); delete sh.namen; delete sh.extra_man; return sh; }
function shiftMan(sh){ if(!Array.isArray(sh.leden)) return (sh.namen||[]).length+Math.ceil(num(sh.extra_man)-1e-9); return Math.max(Math.ceil(num(sh.aantal_man)-1e-9), sh.leden.length); }
function shiftNamen(sh){ return Array.isArray(sh.leden)?sh.leden.map(naamVan).filter(Boolean):(sh.namen||[]); }
function teControleren(){ return (S.data.medewerkers||[]).filter(m=>m.actief&&!m.gecontroleerd); }
function projectPrijs(projectId,t){ const pt=(S.data.projecttarieven||[]).find(x=>x.project_id===projectId&&x.tarief_id===t.id); return num(pt?pt.prijs:t.prijs); }
function tariefRegel(t,projectId,extra){ return Object.assign({categorie:t.categorie, omschrijving:t.omschrijving, tarief_id:t.id, aantal:0, per:null, prijs:projectPrijs(projectId,t), eenheid_n:t.eenheid_n, eenheid_per:t.eenheid_per, eenheid_totaal:t.eenheid_totaal, namen:'', bron:''}, extra||{}); }
function transportKmTarief(){ return tarieven('transport').find(t=>/km/i.test(t.eenheid_totaal||''))||null; }
function voertuig(id){ return (S.data.voertuigen||[]).find(v=>v.id===id); }
function nieuweShift(){ return {aantal_man:0, start:'06:30', eind:'16:00', pauze:'', leden:[], overnachting:false, nachten:''}; }
// Uit shifts en voertuigen de regels van de dag afleiden (arbeid per shift, overnachting samen, km per auto-groep, materieel per dagtarief, transport gebracht materieel).
function afleidRegels(bon){
  const inv=bon.invoer||{shifts:[],voertuigen:[]}, pid=bon.project_id, uit=[]; const arb=arbeidTarief(bon.datum); let nachten=0;
  for(const sh of inv.shifts||[]){ const n=shiftMan(sh), u=shiftUren(sh); if(n>0&&u>0&&arb) uit.push(tariefRegel(arb,pid,{aantal:n, per:u, namen:shiftNamen(sh).join(', '), bron:'shift'})); if(sh.overnachting&&n>0) nachten+=Math.ceil(num(sh.nachten===''||sh.nachten==null?n:sh.nachten)-1e-9); }
  const ov=tarieven('overnachting')[0]; if(nachten>0&&ov) uit.push(tariefRegel(ov,pid,{aantal:nachten, bron:'shift'}));
  const km=tarieven('km')[0], trT=transportKmTarief(); const perKm=new Map(), mat=new Map(); let transportKm=0;
  for(const v of inv.voertuigen||[]){
    const dd=Math.min(1,Math.max(0.25,rondAf(v.dagdeel==null||v.dagdeel===''?1:v.dagdeel,0.25)));
    if(v.soort==='auto'){ if(v.gebracht&&num(v.km)>0){ const k=rondAf(v.km,0.5); perKm.set(k,(perKm.get(k)||0)+1); } continue; }
    const t=(S.data.tarieven||[]).find(t=>t.id===v.tarief_id); if(!t) continue;
    const key=t.id+'|'+dd; const m=mat.get(key)||{t,dd,n:0}; m.n++; mat.set(key,m);
    if(v.gebracht&&num(v.km)>0) transportKm+=rondAf(v.km,0.5);
  }
  if(km) for(const [k,n] of [...perKm.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0])) uit.push(tariefRegel(km,pid,{aantal:n, per:k, bron:'voertuig'}));
  for(const m of mat.values()){ if(m.dd===1&&!m.t.eenheid_per) uit.push(tariefRegel(m.t,pid,{aantal:m.n, bron:'voertuig'})); else uit.push(tariefRegel(m.t,pid,{aantal:m.n, per:m.dd, eenheid_n:m.t.eenheid_n||'stuks', eenheid_per:'dag', bron:'voertuig'})); }
  if(transportKm>0&&trT) uit.push(tariefRegel(trT,pid,{aantal:r2(transportKm), bron:'voertuig'}));
  return uit;
}
function herleid(){ S.bon.regels=afleidRegels(S.bon).concat(S.bon.regels.filter(r=>r.bron==='extra')); }
// Vorige bon van dit project (bij voorkeur van dezelfde teamleider) als voorinvulling: shifts en voertuigen worden onthouden.
function vorigeBon(projectId, datum){ const bs=(S.data.bonnen||[]).filter(b=>b.project_id===projectId&&b.datum<=datum&&b.invoer&&((b.invoer.shifts||[]).length||(b.invoer.voertuigen||[]).length)); return bs.find(b=>b.ingevuld_door===S.wie)||bs[0]||null; }
function vulVoorIn(){ const v=vorigeBon(S.bon.project_id,S.bon.datum); if(!v){ S.bon.invoer={shifts:[nieuweShift()],voertuigen:[]}; S.bon.voorgevuld=''; herleid(); return; }
  S.bon.invoer=JSON.parse(JSON.stringify({shifts:(v.invoer.shifts||[]),voertuigen:v.invoer.voertuigen||[]})); S.bon.invoer.shifts=S.bon.invoer.shifts.map(normShift); S.bon.voorgevuld=v.datum; herleid(); }
function nieuweBon(projectId){
  const eersteProject=(S.data.projecten||[]).find(p=>p.actief);
  S.bon={ id:null, project_id:projectId||(eersteProject?eersteProject.id:null), datum:vandaagISO(), ingevuld_door:S.wie, opmerking:'', afgetekend_door:'', status:'concept',
    beoordeling:'', handtekening_pad:'', handtekening_b64:'', foto_paden:[], fotos_b64:[], regels:[], invoer:{shifts:[],voertuigen:[]}, voorgevuld:'' };
  vulVoorIn(); S.scanInfo=''; S.bonPrint=false;
}
function laadBon(b){
  const inv=b.invoer&&typeof b.invoer==='object'?b.invoer:{}; const regels=regelsVan(b.id).map(r=>({categorie:r.categorie, omschrijving:r.omschrijving, tarief_id:r.tarief_id, aantal:Number(r.aantal), per:r.per==null?null:Number(r.per), prijs:Number(r.prijs),
      eenheid_n:r.eenheid_n, eenheid_per:r.eenheid_per, eenheid_totaal:r.eenheid_totaal, namen:r.namen||'', bron:r.bron||''}));
  // Oude bonnen (zonder invoer) hebben alleen losse regels: die blijven als extra regels bewerkbaar.
  const heeftInvoer=(inv.shifts||[]).length||(inv.voertuigen||[]).length;
  S.bon={ id:b.id, project_id:b.project_id, datum:b.datum, ingevuld_door:b.ingevuld_door, opmerking:b.opmerking, afgetekend_door:b.afgetekend_door, status:b.status,
    beoordeling:b.beoordeling, beoordeeld_door:b.beoordeeld_door, handtekening_pad:b.handtekening_pad, handtekening_b64:'', foto_paden:(b.foto_paden||[]).slice(), fotos_b64:[],
    invoer:{shifts:(inv.shifts||[]).map(normShift), voertuigen:(inv.voertuigen||[]).slice()}, voorgevuld:'',
    regels:heeftInvoer?regels:regels.map(r=>Object.assign(r,{bron:r.bron||'extra'})) };
  S.tab='bon'; S.scanInfo=''; S.bonPrint=false;
}
function regelToevoegen(cat){
  const c=CAT[cat]; let t=null;
  if(cat==='arbeid') t=arbeidTarief(S.bon.datum); else { const ts=tarieven(cat); if(ts.length===1||cat==='km'||cat==='overnachting') t=ts[0]||null; }
  S.bon.regels.push({ categorie:cat, omschrijving:t?t.omschrijving:(cat==='materieel'||cat==='transport'||cat==='materiaal'?'':c.naam), tarief_id:t?t.id:null,
    aantal:0, per:(cat==='arbeid'||cat==='km')?0:(t&&t.eenheid_per?1:null), prijs:t?projectPrijs(S.bon.project_id,t):0,
    eenheid_n:t?t.eenheid_n:c.n, eenheid_per:t?t.eenheid_per:c.per, eenheid_totaal:t?t.eenheid_totaal:c.tot, namen:'', bron:'extra' });
}
function regelBedrag(r){ const tot=r.per==null?num(r.aantal):num(r.aantal)*num(r.per); return {totaal:r2(tot), bedrag:r2(r2(tot)*num(r.prijs))}; }
function bonSom(){ return somExact(S.bon.regels.map(r=>({totaal:regelBedrag(r).totaal, prijs:r.prijs}))); }
function magBewerken(){ if(!S.bon.id) return true; if(isAdmin()) return S.bon.status!=='gefactureerd'; return ['concept','afgekeurd'].includes(S.bon.status); }
function tijdOpties(){ const o=[]; for(let m=0;m<24*60;m+=15) o.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')); return o; }
function tijdSelect(attr, val, d){ return '<select '+attr+' '+d+'>'+tijdOpties().map(t=>'<option '+(t===val?'selected':'')+'>'+t+'</option>').join('')+'</select>'; }

function viewBon(){

  const projecten=(S.data.projecten||[]).filter(p=>p.actief||p.id===b.project_id); const pr=project(b.project_id)||{};

    +'<label>Teamleider<input type="text" id="b-wie" value="'+esc(b.ingevuld_door)+'" '+d+'></label></div>';
  x+='<div class="stil">'+fmtDatum(b.datum)+' · '+(dagType(b.datum)==='zo'?'zondagtarief':dagType(b.datum)==='za'?'zaterdagtarief':'normaal tarief')+(pr.opdrachtgever_id?' · opdrachtgever '+esc((bedrijf(pr.opdrachtgever_id)||{}).naam||''):'')+(bew?' · <a href="#" id="b-wizard">'+(magGeld()?'projectprijzen':'projectgegevens')+'</a>':'')+'</div>';
  if(b.voorgevuld&&bew) x+='<div class="info" id="b-voorgevuld">↩ Overgenomen van de bon van '+fmtKort(b.voorgevuld)+': dezelfde ploegen (aantal man en tijden) en voertuigen. Kijk ze na — klopt het niet? <button class="knop klein licht" id="b-wis">alles wissen</button></div>';
  x+='</div>';
  // --- shifts ---
  const inv=b.invoer||(b.invoer={shifts:[],voertuigen:[]}); inv.shifts=(inv.shifts||[]).map(normShift); inv.voertuigen=inv.voertuigen||[];
  const tc=teControleren();
  x+='<div class="kaart"><h2>👷 Wie heeft er gewerkt?</h2>';
  inv.shifts.forEach((sh,i)=>{

    x+='<div class="shift" data-shift="'+i+'"><div class="shiftkop"><b>Ploeg '+(i+1)+'</b><span class="stil">'+n+' man × '+fmtNum(u,1)+' uur</span>'+(bew?'<button class="x" data-shdel="'+i+'" title="ploeg verwijderen">×</button>':'')+'</div>';
    x+='<div class="rij tijden"><label>Aantal man<input type="number" step="1" min="0" inputmode="numeric" data-sh="'+i+'" data-sf="aantal_man" value="'+esc(sh.aantal_man||0)+'" '+d+'></label><label>Start'+tijdSelect('data-sh="'+i+'" data-sf="start"',sh.start,d)+'</label><label>Eind'+tijdSelect('data-sh="'+i+'" data-sf="eind"',sh.eind,d)+'</label>'
      +'<label>Pauze<select data-sh="'+i+'" data-sf="pauze" '+d+'><option value="" '+(sh.pauze===''||sh.pauze==null?'selected':'')+'>auto ('+fmtNum(shiftPauze(sh),1)+')</option>'+[0,0.5,1,1.5].map(p=>'<option value="'+p+'" '+(sh.pauze!==''&&sh.pauze!=null&&num(sh.pauze)===p?'selected':'')+'>'+fmtNum(p,1)+' uur</option>').join('')+'</select></label>'

let sigCanvas=null;
function initSig(){
  sigCanvas=document.getElementById('b-sig'); if(!sigCanvas) return;
  const c=sigCanvas, ctx=c.getContext('2d'); c.width=c.offsetWidth*2; c.height=c.offsetHeight*2; ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#123';
  // Geen uitlegregel boven het vak: "teken hier" staat in het vak zelf en verdwijnt bij de eerste streek.
  let leeg=true;
  const hint=()=>{ if(!leeg) return; ctx.save(); ctx.fillStyle='#8a9a92'; ctx.font='italic 17px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign='center'; ctx.fillText('teken hier met je vinger', c.offsetWidth/2, c.offsetHeight/2+6); ctx.restore(); };
  if(S.bon.handtekening_b64){ leeg=false; const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,c.offsetWidth,c.offsetHeight); im.src=S.bon.handtekening_b64; } else hint();
  const wis=()=>{ ctx.clearRect(0,0,c.width,c.height); leeg=true; hint(); };
  let tekent=false;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  c.onpointerdown=e=>{ if(leeg){ ctx.clearRect(0,0,c.width,c.height); leeg=false; } tekent=true; c.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
  c.onpointermove=e=>{ if(!tekent) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ if(tekent){ tekent=false; S.bon.handtekening_b64=c.toDataURL('image/png'); } };
  document.getElementById('b-sig-wis').onclick=()=>{ wis(); S.bon.handtekening_b64=''; };
}
function verkleinFoto(file){
  return new Promise((ok,nee)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const max=1600; let w=im.width,h=im.height; if(w>max||h>max){ const f=max/Math.max(w,h); w=Math.round(w*f); h=Math.round(h*f); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); ok(cv.toDataURL('image/jpeg',0.82)); }; im.onerror=nee; im.src=fr.result; }; fr.onerror=nee; fr.readAsDataURL(file); });
}

async function bonOpslaan(indienen, stil){
  const f=bonFields(); const regels=S.bon.regels.filter(r=>num(r.aantal)>0).map(r=>Object.assign({},r,{omschrijving:r.omschrijving||CAT[r.categorie].naam}));
  if(!f.project_id){ toast('Kies een project'); return false; }
  if(indienen&&!regels.length){ toast('Vul minimaal één ploeg, voertuig of regel in'); return false; }
  const leeg=regels.find(r=>!r.omschrijving.trim()); if(leeg){ toast('Een regel heeft nog geen omschrijving'); return false; }
  for(const r of regels){ const fout=regelFout(r); if(fout){ toast(fout+' — '+r.omschrijving); return false; } }
  const pr=project(f.project_id);
  const j=await doe({action:'bon_save', id:S.bon.id, fields:f, regels, indienen:!!indienen}, (indienen?'Dagbon ingediend: ':'Dagbon opgeslagen: ')+(pr?pr.naam:'')+' '+fmtKort(f.datum)+(magGeld()?' '+fmtGeld(r2(regels.reduce((s,r)=>s+regelBedrag(r).bedrag,0))):''));
  if(j&&j.id){ const nb=(S.data.bonnen||[]).find(x=>x.id===j.id); if(nb){ laadBon(nb); render(); } if(!stil) toast(indienen?'Bon ingediend bij de administratie':'Bon opgeslagen'); return true; }
  return false;
}
function bindBon(){
  const app=document.getElementById('app'); const k=id=>document.getElementById(id);
  if(k('pb-terug')){ k('pb-terug').onclick=()=>{ S.bonPrint=false; render(); }; k('pb-print').onclick=()=>window.print(); return; }
  initSig();
  const ververs=()=>{ leesBonInputs(); herleid(); render(); };
  // ploegen
  app.querySelectorAll('[data-sh][data-sf]').forEach(el=>el.addEventListener('change',()=>{ const sh=S.bon.invoer.shifts[+el.dataset.sh]; const f=el.dataset.sf;
    if(f==='overnachting') sh.overnachting=el.checked; else if(f==='pauze'||f==='aantal_man'||f==='nachten') sh[f]=el.value===''?'':Math.max(0,num(el.value)); else sh[f]=el.value;
    if(f==='aantal_man'){ sh.aantal_man=Math.ceil(num(sh.aantal_man)-1e-9); if(sh.aantal_man<sh.leden.length){ sh.aantal_man=sh.leden.length; toast('Er zijn al '+sh.leden.length+' namen aangetikt'); } } if(f==='nachten'&&sh.nachten!=='') sh.nachten=Math.ceil(num(sh.nachten)-1e-9);
    ververs(); }));

  app.querySelectorAll('.bonregel [data-f]').forEach(el=>{
    el.addEventListener('input',()=>{ const r=S.bon.regels[+el.dataset.i]; const f=el.dataset.f;
      if(f==='aantal'||f==='per') r[f]=(f==='per'&&el.value==='')?null:num(el.value); else r[f]=el.value;

      if(t){ r.tarief_id=t.id; r.omschrijving=t.omschrijving; r.prijs=projectPrijs(S.bon.project_id,t); r.eenheid_n=t.eenheid_n; r.eenheid_per=t.eenheid_per; r.eenheid_totaal=t.eenheid_totaal; if(t.eenheid_per&&r.per==null) r.per=1; if(!t.eenheid_per) r.per=null; }

// Uitgelezen regels uit de foto als extra regels in de bon zetten; datum/aftekening alleen invullen als leeg.
function scanToepassen(j, b64){
  const nieuw=(j.regels||[]).map(r=>({categorie:r.categorie, omschrijving:r.omschrijving, tarief_id:r.tarief_id, aantal:num(r.aantal), per:r.per==null?null:num(r.per), prijs:num(r.prijs), eenheid_n:r.eenheid_n||CAT[r.categorie].n, eenheid_per:r.eenheid_per||CAT[r.categorie].per, eenheid_totaal:r.eenheid_totaal||CAT[r.categorie].tot, namen:r.namen||'', bron:'extra', uitgelezen:true, zekerheid:r.zekerheid, gekoppeld:r.gekoppeld}));
  S.bon.regels=S.bon.regels.filter(r=>r.bron!=='extra'||num(r.aantal)>0).concat(nieuw);
  if(j.datum&&(!S.bon.id)) S.bon.datum=j.datum;
  if(j.afgetekend_door&&!S.bon.afgetekend_door) S.bon.afgetekend_door=j.afgetekend_door;
  if(j.opmerking&&!S.bon.opmerking) S.bon.opmerking=j.opmerking;
  S.bon.fotos_b64.push(b64);
  const los=nieuw.filter(r=>!r.gekoppeld).length, laag=nieuw.filter(r=>r.zekerheid==='laag').length;
  S.scanInfo=nieuw.length+' regel'+(nieuw.length===1?'':'s')+' uit de foto gehaald (leesbaarheid '+(j.leesbaarheid||'?')+')'+(los?'; '+los+' zonder tarief (prijs zelf kiezen)':'')+(laag?'; '+laag+' met lage zekerheid':'')+'. Controleer de gemarkeerde regels.';
  toast(nieuw.length?'Bon uitgelezen: controleer de regels':'Geen regels herkend op de foto');
}
function leesBonInputs(){ const f=bonFields(); Object.assign(S.bon,{project_id:f.project_id, datum:f.datum, ingevuld_door:f.ingevuld_door, opmerking:f.opmerking, afgetekend_door:f.afgetekend_door}); }
function vraag(titel, huidig, cb){

// Namenwolk achter "+ namen": sheet met zoekveld, alle namen op alfabet (aangetikt = groen, nieuw van de werkvloer = oranje met ?),
// en een veld om een nieuwe naam aan te maken. Zo blijft de dagbon op de telefoon kort.
function namenKiezerHtml(i, zoek){

  return wolk.length?'<div class="wolk">'+wolk.map(m=>'<button class="naam'+(sh.leden.includes(m.id)?' aan':'')+(m.gecontroleerd?'':' check')+'" data-lid="'+m.id+'"'+(m.gecontroleerd?'':' title="nieuw van de werkvloer, nog te controleren"')+'>'+esc(m.naam)+(m.gecontroleerd?'':' ?')+'</button>').join('')+'</div>':'<div class="stil">Geen naam gevonden. Maak hem hieronder aan.</div>';
}
function namenKiezer(i){
  const sh=S.bon.invoer.shifts[i]; const sheet=document.getElementById('sheet'); let zoek='';
  const dicht=()=>{ sheet.style.display='none'; sheet.innerHTML=''; herleid(); render(); };

    +'<div class="rij" style="margin-top:10px"><label>Naam er niet bij?<input type="text" id="nk-naam" placeholder="voor- en achternaam" autocomplete="off"></label><button class="knop licht" id="nk-toevoegen" style="align-self:flex-end">+ toevoegen</button></div>'
    +'<div class="sheetrij"><button class="knop" id="nk-klaar" style="flex:1;text-align:center">Klaar</button></div></div>';

  const k=id=>document.getElementById(id);

  teken();
  k('nk-zoek').addEventListener('input',()=>{ zoek=k('nk-zoek').value; teken(); });
  k('nk-klaar').onclick=dicht;
  const toevoegen=async()=>{ const naam=k('nk-naam').value.trim(); if(!naam){ toast('Vul een naam in'); return; } k('nk-toevoegen').disabled=true;
    try{ const j=await api({action:'medewerker_save', fields:{naam}, log:'Naam toegevoegd op de werkvloer: '+naam}); await laad(); if(j.id&&!sh.leden.includes(j.id)){ sh.leden.push(j.id); if(sh.leden.length>num(sh.aantal_man)) sh.aantal_man=sh.leden.length; } k('nk-naam').value=''; zoek=''; k('nk-zoek').value=''; toast(j.bestaand?'Naam bestond al en is aangetikt':'Naam toegevoegd; de projectleider controleert hem'); }
    catch(e){ toast(e.auth?'Niet ingelogd':(e.message||'Opslaan mislukt')); }
    k('nk-toevoegen').disabled=false; teken(); };
  k('nk-toevoegen').onclick=toevoegen; k('nk-naam').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); toevoegen(); } });
  setTimeout(()=>k('nk-zoek').focus(),50);

    if(st.stap==='gegevens'){
      h+='<div class="rij" style="display:grid;grid-template-columns:1fr 1fr"><label>Projectnummer<input type="text" data-k="code" value="'+esc(st.p.code)+'"></label><label>Naam<input type="text" data-k="naam" value="'+esc(st.p.naam)+'" placeholder="bijv. Enserweg"></label>'

        +'<label style="grid-column:1/-1">Omschrijving op factuur<input type="text" data-k="factuur_omschrijving" value="'+esc(st.p.factuur_omschrijving)+'" placeholder="Uitgevoerde werkzaamheden t.a.v. …"></label></div>';

/* ---------- weekoverzicht (KZ-opmaak) ---------- */
function wekenVoor(projectId){
  const set=new Map();
  for(const b of (S.data.bonnen||[])) if(!projectId||b.project_id===projectId){ const w=isoWeek(b.datum); set.set(w.jaar+'-'+w.week,w); }
  const nu=isoWeek(vandaagISO()); set.set(nu.jaar+'-'+nu.week,nu);
  return Array.from(set.values()).sort((a,b)=>b.jaar-a.jaar||b.week-a.week);
}
function bonnenWeek(projectId, jaar, week, statussen, weekTot){
  const tot=weekTot||week;
  return (S.data.bonnen||[]).filter(b=>b.project_id===projectId&&(!statussen||statussen.includes(b.status))).filter(b=>{ const w=isoWeek(b.datum); return w.jaar===jaar&&w.week>=week&&w.week<=tot; }).sort((a,b)=>a.datum<b.datum?-1:a.datum>b.datum?1:a.id-b.id);
}
// Een overzicht of factuur kan meerdere weken beslaan (KZ 2026200: "week 26 en 27").
function wekenTekst(bonnen, week){
  const w=Array.from(new Set(bonnen.map(b=>isoWeek(b.datum).week))).sort((a,b)=>a-b); if(!w.length) return String(week);
  return w.length===1?String(w[0]):w.slice(0,-1).join(', ')+' en '+w[w.length-1];
}
function totWekenOpties(weken, jaar, vanaf, gekozen){
  return weken.filter(w=>w.jaar===jaar&&w.week>=vanaf).sort((a,b)=>a.week-b.week).map(w=>'<option value="'+w.week+'" '+(w.week===gekozen?'selected':'')+'>'+(w.week===vanaf?'alleen deze week':'t/m week '+w.week)+'</option>').join('');
}
// Bouwt de overzichtstructuur zoals KZ hem levert: per dag arbeid/km/overnachting, daarna Materieel, Transport, Diversen (over de hele week samengevoegd).
function bouwOverzicht(bonnen){
  const dagen=new Map(); const agg={materieel:new Map(), transport:new Map(), materiaal:new Map()};
  for(const b of bonnen){
    for(const r of regelsVan(b.id)){
      if(['arbeid','km','overnachting'].includes(r.categorie)){ if(!dagen.has(b.datum)) dagen.set(b.datum,[]); dagen.get(b.datum).push(r); }
      else { const m=agg[r.categorie]; const key=r.omschrijving+'|'+Number(r.prijs).toFixed(2)+'|'+r.eenheid_totaal;
        if(!m.has(key)) m.set(key,{omschrijving:r.omschrijving, prijs:Number(r.prijs), eenheid_totaal:r.eenheid_totaal, totaal:0, bedrag:0});
        const a=m.get(key); a.totaal=r2(a.totaal+Number(r.totaal)); a.bedrag=r2(a.totaal*a.prijs); }
    }
  }
  const dagLijst=Array.from(dagen.entries()).sort((a,b)=>a[0]<b[0]?-1:1).map(([datum,regels])=>({datum, regels:regels.sort((a,b)=>(['arbeid','km','overnachting'].indexOf(a.categorie)-['arbeid','km','overnachting'].indexOf(b.categorie))||a.sort-b.sort)}));
  const totaal=bonnenTotaal(bonnen.map(b=>b.id));
  return {dagen:dagLijst, materieel:Array.from(agg.materieel.values()), transport:Array.from(agg.transport.values()), materiaal:Array.from(agg.materiaal.values()), totaal};
}
function aantalTekst(r){
  if(r.per==null) return '';
  const n=Number(r.aantal), per=Number(r.per);
  if(r.categorie==='arbeid') return fmtNum(n)+' '+(r.eenheid_n||'man')+'&nbsp;&nbsp; '+fmtNum(per,1)+' '+(r.eenheid_per||'uur');
  return fmtNum(n)+' '+(r.eenheid_n||'')+'&nbsp;&nbsp; '+fmtNum(per)+' '+(r.eenheid_per||'');
}
function overzichtDoc(projectId, jaar, week, bonnen, opts){
  const p=project(projectId)||{}; const aan=bedrijf(p.aannemer_id)||{}; const opd=bedrijf(p.opdrachtgever_id)||{};
  const o=bouwOverzicht(bonnen);
  let x='<div class="doc"><div class="kopblok"><div class="firma">'+logoHtml(aan,44)+firmaNaam(aan)+'<small>'+firmaNaamKlein(aan)+esc(aan.adres||'')+(aan.adres?', ':'')+esc(aan.postcode_plaats||'')+(aan.website?' · '+esc(aan.website.replace(/^https?:\/\//,'')):'')+'</small></div><div style="text-align:right"><h1>Overzicht werkzaamheden week '+wekenTekst(bonnen,week)+'</h1><div>'+fmtDMY(opts&&opts.datum||vandaagISO())+'</div></div></div>';
  x+='<div class="meta"><b>Opdrachtgever:</b><span>'+esc((opd.naam||'').replace(/ (B\.V\.|BV)$/i,''))+'</span><b>Project:</b><span>'+esc(p.code||'')+'</span><b>Projectadres:</b><span>'+esc(p.adres||'')+'<br>'+esc(p.postcode_plaats||'')+'</span></div>';
  const geld=magGeld(), kol=geld?5:3;
  x+='<table><tr><th>Omschrijving</th><th>Aantal</th><th>Eenheid</th>'+(geld?'<th class="r">Prijs</th><th class="r">Kosten</th>':'')+'</tr>';
  for(const d of o.dagen){ x+='<tr class="dag"><td colspan="'+kol+'">'+fmtDatum(d.datum)+'</td></tr>';
    for(const r of d.regels) x+='<tr><td>'+esc(r.categorie==='arbeid'?'Arbeid':r.categorie==='km'?'Kilometervergoeding':r.categorie==='overnachting'?'Overnachtingsvergoeding':r.omschrijving)+'</td><td>'+aantalTekst(r)+'</td><td>'+fmtNum(r.totaal)+' '+esc(r.eenheid_totaal)+'</td>'+(geld?'<td class="r">'+fmtGeld(r.prijs)+'</td><td class="r">'+fmtGeld(r.bedrag)+'</td>':'')+'</tr>'; }
  const sec=(titel,lijst)=>{ if(!lijst.length) return ''; let y='<tr class="sec"><td colspan="'+kol+'">'+titel+'</td></tr>'; for(const r of lijst) y+='<tr><td>'+esc(r.omschrijving)+'</td><td></td><td>'+fmtNum(r.totaal)+' '+esc(r.eenheid_totaal)+'</td>'+(geld?'<td class="r">'+fmtGeld(r.prijs)+'</td><td class="r">'+fmtGeld(r.bedrag)+'</td>':'')+'</tr>'; return y; };
  x+=sec('Materieel',o.materieel)+sec('Transport',o.transport)+sec('Diversen',o.materiaal);
  if(geld) x+='<tr class="tot"><td colspan="3">Totaal</td><td></td><td class="r">'+fmtGeld(o.totaal)+'</td></tr><tr><td colspan="5" style="text-align:right;font-size:11px">excl. btw.</td></tr>';
  x+='</table>';
  x+='<div class="voet">Gebaseerd op '+bonnen.length+' afgetekende dagbon'+(bonnen.length===1?'':'nen')+(bonnen.length?' ('+bonnen.map(b=>'#'+b.id).join(', ')+')':'')+'.</div></div>';
  return x;
}

  if(!weken.length) x+='</div><div class="stil">Geen goedgekeurde, nog niet gefactureerde bonnen voor dit project.</div>';
  else {
    const bonnen=bonnenWeek(pid,wk.jaar,wk.week,['goedgekeurd'],wkTot); const tot=bonnenTotaal(bonnen.map(b=>b.id)); const btw=Number((S.data.instellingen||{}).btw_pct||21);

    +(b.email?'      <cac:Contact><cbc:ElectronicMail>'+xmlEsc(b.email)+'</cbc:ElectronicMail>'+(b.telefoon?'<cbc:Telephone>'+xmlEsc(b.telefoon)+'</cbc:Telephone>':'')+'</cac:Contact>\n':'')

function n2(n){ return Number(n||0).toFixed(2); }
// UBL 2.1 verkoopfactuur (EN 16931 / Peppol BIS 3.0 / NLCIUS-opzet): 1 regel "volgens overzicht" zoals KZ factureert,
// met het weekoverzicht als specificatie in de Note en als extra regels-commentaar.
function maakUBL(f){
  const p=project(f.project_id)||{}; const aan=bedrijf(p.aannemer_id)||{naam:''}; const opd=bedrijf(p.opdrachtgever_id)||{naam:''}; const bonnen=factuurBonnen(f); const o=bouwOverzicht(bonnen);
  const spec=[]; for(const d of o.dagen){ spec.push(fmtDatum(d.datum)+':'); for(const r of d.regels) spec.push('  '+(r.categorie==='arbeid'?'Arbeid':r.categorie==='km'?'Kilometervergoeding':r.categorie==='overnachting'?'Overnachtingsvergoeding':r.omschrijving)+' '+aantalTekst(r).replace(/&nbsp;/g,'').replace(/\s+/g,' ')+' '+fmtNum(r.totaal)+' '+r.eenheid_totaal+' x '+fmtGeld(r.prijs)+' = '+fmtGeld(r.bedrag)); }
  for(const [t,l] of [['Materieel',o.materieel],['Transport',o.transport],['Diversen',o.materiaal]]) if(l.length){ spec.push(t+':'); for(const r of l) spec.push('  '+r.omschrijving+' '+fmtNum(r.totaal)+' '+r.eenheid_totaal+' x '+fmtGeld(r.prijs)+' = '+fmtGeld(r.bedrag)); }
  let x='<?xml version="1.0" encoding="UTF-8"?>\n<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">\n';
  x+='  <cbc:CustomizationID>urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0</cbc:CustomizationID>\n  <cbc:ProfileID>urn:fdc:peppol.eu:2017:poacc:billing:01:1.0</cbc:ProfileID>\n';
  x+='  <cbc:ID>'+xmlEsc(f.nummer)+'</cbc:ID>\n  <cbc:IssueDate>'+xmlEsc(f.datum)+'</cbc:IssueDate>\n  <cbc:DueDate>'+xmlEsc(f.vervaldatum||f.datum)+'</cbc:DueDate>\n  <cbc:InvoiceTypeCode>380</cbc:InvoiceTypeCode>\n';
  x+='  <cbc:Note>'+xmlEsc(f.omschrijving+' - week '+wekenTekst(bonnen,f.week)+' '+f.jaar+'\n'+spec.join('\n'))+'</cbc:Note>\n  <cbc:DocumentCurrencyCode>EUR</cbc:DocumentCurrencyCode>\n';
  x+='  <cbc:BuyerReference>'+xmlEsc(p.claimnummer||p.code||f.nummer)+'</cbc:BuyerReference>\n  <cac:OrderReference><cbc:ID>'+xmlEsc(p.code||'')+'</cbc:ID></cac:OrderReference>\n';
  x+=partij(aan,'AccountingSupplierParty')+partij(opd,'AccountingCustomerParty');
  x+='  <cac:PaymentMeans><cbc:PaymentMeansCode>30</cbc:PaymentMeansCode><cbc:PaymentID>'+xmlEsc(f.nummer)+'</cbc:PaymentID>'+(aan.iban?'<cac:PayeeFinancialAccount><cbc:ID>'+xmlEsc(aan.iban.replace(/\s/g,''))+'</cbc:ID></cac:PayeeFinancialAccount>':'')+'</cac:PaymentMeans>\n';
  x+='  <cac:PaymentTerms><cbc:Note>Betaling binnen '+xmlEsc((S.data.instellingen||{}).betaaltermijn_dagen||14)+' dagen, vervaldatum '+xmlEsc(f.vervaldatum||'')+'</cbc:Note></cac:PaymentTerms>\n';
  x+='  <cac:TaxTotal><cbc:TaxAmount currencyID="EUR">'+n2(f.btw_bedrag)+'</cbc:TaxAmount><cac:TaxSubtotal><cbc:TaxableAmount currencyID="EUR">'+n2(f.bedrag_excl)+'</cbc:TaxableAmount><cbc:TaxAmount currencyID="EUR">'+n2(f.btw_bedrag)+'</cbc:TaxAmount><cac:TaxCategory><cbc:ID>S</cbc:ID><cbc:Percent>'+n2(f.btw_pct)+'</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal></cac:TaxTotal>\n';
  x+='  <cac:LegalMonetaryTotal><cbc:LineExtensionAmount currencyID="EUR">'+n2(f.bedrag_excl)+'</cbc:LineExtensionAmount><cbc:TaxExclusiveAmount currencyID="EUR">'+n2(f.bedrag_excl)+'</cbc:TaxExclusiveAmount><cbc:TaxInclusiveAmount currencyID="EUR">'+n2(f.bedrag_incl)+'</cbc:TaxInclusiveAmount><cbc:PayableAmount currencyID="EUR">'+n2(f.bedrag_incl)+'</cbc:PayableAmount></cac:LegalMonetaryTotal>\n';
  x+='  <cac:InvoiceLine><cbc:ID>1</cbc:ID><cbc:Note>'+xmlEsc('Overzicht werkzaamheden week '+wekenTekst(bonnen,f.week)+' '+f.jaar+', dagbonnen '+bonnen.map(b=>fmtKort(b.datum)).join(', '))+'</cbc:Note><cbc:InvoicedQuantity unitCode="C62">1</cbc:InvoicedQuantity><cbc:LineExtensionAmount currencyID="EUR">'+n2(f.bedrag_excl)+'</cbc:LineExtensionAmount>'
    +'<cac:Item><cbc:Description>'+xmlEsc(f.omschrijving)+'</cbc:Description><cbc:Name>'+xmlEsc(f.regel_omschrijving)+'</cbc:Name><cac:ClassifiedTaxCategory><cbc:ID>S</cbc:ID><cbc:Percent>'+n2(f.btw_pct)+'</cbc:Percent><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory></cac:Item>'
    +'<cac:Price><cbc:PriceAmount currencyID="EUR">'+n2(f.bedrag_excl)+'</cbc:PriceAmount><cbc:BaseQuantity unitCode="C62">1</cbc:BaseQuantity></cac:Price></cac:InvoiceLine>\n';
  x+='</Invoice>\n';
  return x;
}
// CSV voor de Exact Online-import (Verkoop > Import > verkoopfacturen): kop + gespecificeerde regels (weekoverzicht) met NL-notatie (; en decimale komma).
function maakCSV(f){
  const p=project(f.project_id)||{}; const opd=bedrijf(p.opdrachtgever_id)||{}; const bonnen=factuurBonnen(f); const o=bouwOverzicht(bonnen);
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"'; const nl=n=>String(Number(n||0).toFixed(2)).replace('.',',');
  const kop=['Factuurnummer','Factuurdatum','Vervaldatum','Debiteurcode','Debiteurnaam','Uw referentie','Omschrijving factuur','Regel','Regelomschrijving','Aantal','Eenheid','Prijs','Bedrag excl','Btw%','Btw code','Project','Week','Datum werk'];
  const rijen=[kop.map(cel).join(';')];
  let nr=0; const basis=[f.nummer,fmtKort(f.datum),fmtKort(f.vervaldatum),opd.debiteur_code||'',opd.naam||'',p.claimnummer||p.code||'',f.omschrijving];
  const wk=wekenTekst(bonnen,f.week); let som=0;
  const regel=(oms,aantal,eenheid,prijs,bedrag,datum)=>{ nr++; som=r2(som+r2(Number(aantal)*Number(prijs))); rijen.push([...basis,nr,oms,fmtNum(aantal),eenheid,nl(prijs),nl(bedrag),nl(f.btw_pct),'2',p.code||'',wk,datum||''].map(cel).join(';')); };
  for(const d of o.dagen) for(const r of d.regels) regel((r.categorie==='arbeid'?'Arbeid':r.categorie==='km'?'Kilometervergoeding':r.categorie==='overnachting'?'Overnachtingsvergoeding':r.omschrijving)+(r.per!=null?' ('+aantalTekst(r).replace(/&nbsp;/g,'').replace(/\s+/g,' ')+')':''), r.totaal, r.eenheid_totaal, r.prijs, r.bedrag, fmtKort(d.datum));
  for(const l of [o.materieel,o.transport,o.materiaal]) for(const r of l) regel(r.omschrijving, r.totaal, r.eenheid_totaal, r.prijs, r.bedrag, '');
  // Het totaal wordt pas na optellen afgerond (zoals KZ); de afgeronde regels kunnen dan een cent schelen.
  const verschil=r2(Number(f.bedrag_excl)-som); if(verschil) regel('Afrondingsverschil', 1, '', verschil, verschil, '');
  rijen.push(['','','','','','','','','TOTAAL excl. btw','','','',nl(f.bedrag_excl),nl(f.btw_pct),'','','',''].map(cel).join(';'));
  return '﻿'+rijen.join('\r\n')+'\r\n';
}
// JSON in de vorm van de Exact Online REST API (salesinvoice/SalesInvoices) - voor een koppeling of Power Automate-flow.
function maakJSON(f){
  const p=project(f.project_id)||{}; const opd=bedrijf(p.opdrachtgever_id)||{}; const bonnen=factuurBonnen(f); const o=bouwOverzicht(bonnen);
  const lines=[]; const add=(oms,q,prijs,notes)=>lines.push({Description:oms.slice(0,60), Notes:notes||'', Quantity:Number(q), UnitPrice:Number(prijs), VATCode:'2', VATPercentage:Number(f.btw_pct)/100});
  for(const d of o.dagen) for(const r of d.regels) add((r.categorie==='arbeid'?'Arbeid':r.categorie==='km'?'Kilometervergoeding':r.categorie==='overnachting'?'Overnachtingsvergoeding':r.omschrijving)+' '+fmtKort(d.datum), r.totaal, r.prijs, aantalTekst(r).replace(/&nbsp;/g,'').replace(/\s+/g,' '));
  for(const l of [o.materieel,o.transport,o.materiaal]) for(const r of l) add(r.omschrijving, r.totaal, r.prijs, r.eenheid_totaal);
  const verschil=r2(Number(f.bedrag_excl)-lines.reduce((s,l)=>r2(s+r2(l.Quantity*l.UnitPrice)),0)); if(verschil) add('Afrondingsverschil', 1, verschil, 'totaal afgerond na optellen');
  const wk=wekenTekst(bonnen,f.week);
  return JSON.stringify({ InvoiceNumber:f.nummer, OrderDate:f.datum, InvoiceDate:f.datum, DueDate:f.vervaldatum, Currency:'EUR', Description:((p.naam||'')+' week '+wk+' - '+f.omschrijving).slice(0,60), YourRef:p.claimnummer||p.code||'',
    OrderedBy_Code:opd.debiteur_code||'', OrderedBy_Name:opd.naam||'', InvoiceTo_Code:opd.debiteur_code||'', AmountDC:Number(f.bedrag_incl), AmountFC:Number(f.bedrag_incl), VATAmountDC:Number(f.btw_bedrag),
    Project:p.code||'', Week:f.week, Weeks:wk, Year:f.jaar, SalesInvoiceLines:lines, Bonnen:bonnen.map(b=>({id:b.id, datum:b.datum, ingevuld_door:b.ingevuld_door, afgetekend_door:b.afgetekend_door, bedrag:bonTotaal(b.id)})) }, null, 2);
}

// CSV uit het boekhoudpakket: omschrijving;prijs;eenheid[;categorie]. Scheiding ; , of tab; kopregel wordt herkend en overgeslagen; decimale komma toegestaan.
function leesTarievenCSV(tekst){
  const regels=String(tekst||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(r=>r.trim()).filter(Boolean); const uit=[];
  for(const r of regels){ const sep=r.includes(';')?';':r.includes('\t')?'\t':','; const c=r.split(sep).map(x=>x.trim().replace(/^"|"$/g,'')); if(c.length<2) continue;
    const prijs=Number(String(c[1]).replace(/[€\s]/g,'').replace(',','.')); if(!Number.isFinite(prijs)||!c[0]) continue;
    uit.push({omschrijving:c[0], prijs:r2(prijs), eenheid_totaal:c[2]||'', categorie:['materiaal','materieel','transport'].includes(String(c[3]||'').toLowerCase())?String(c[3]).toLowerCase():'materiaal'}); }
  return uit;
}

  const vrtVelden=[{k:'naam',l:'Naam (bijv. Bus 1, Hoogwerker 2)'},{k:'soort',l:'Soort',opties:[{v:'auto',t:'auto (km-vergoeding)'},{v:'materieel',t:'materieel (dagtarief)'}]},{k:'kenteken',l:'Kenteken (optioneel)'},{k:'tarief_id',l:'Dagtarief (materieel)',opties:matOpt},{k:'sort',l:'Volgorde',type:'number'}];
  const vrtSave=(id,v)=>formSheet(id?'Voertuig aanpassen':'Nieuw voertuig / materieel',vrtVelden,v||{soort:'auto',sort:100,tarief_id:''},async f=>{ f.tarief_id=f.tarief_id?Number(f.tarief_id):null; await doe({action:'voertuig_save', id, fields:f},'Voertuig opgeslagen: '+f.naam); });
  app.querySelectorAll('tr[data-voertuig]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('button')) return; vrtSave(+tr.dataset.voertuig,S.data.voertuigen.find(v=>v.id===+tr.dataset.voertuig)); });
  app.querySelectorAll('[data-vdel2]').forEach(b=>b.onclick=async()=>{ if(confirm('Voertuig verwijderen?')) await doe({action:'voertuig_delete', id:+b.dataset.vdel2},'Voertuig verwijderd #'+b.dataset.vdel2); });
  const vn=document.getElementById('v-nieuw'); if(vn) vn.onclick=()=>vrtSave(null,null);
  const bedVelden=[{k:'soort',l:'Soort',opties:[{v:'aannemer',t:'aannemer (factureert)'},{v:'opdrachtgever',t:'opdrachtgever (ontvangt factuur)'}]},{k:'naam',l:'Naam'},{k:'adres',l:'Adres'},{k:'postcode_plaats',l:'Postcode plaats'},{k:'land',l:'Land (NL)'},{k:'kvk',l:'KvK'},{k:'btw_nummer',l:'Btw-nummer'},{k:'iban',l:'IBAN'},{k:'email',l:'E-mail'},{k:'telefoon',l:'Telefoon'},{k:'debiteur_code',l:'Debiteur-/relatiecode Exact'},{k:'website',l:'Website'},{k:'kleur',l:'Hoofdkleur huisstijl (bijv. #1d4e89)'},{k:'kleur2',l:'Tweede kleur (knoppen goedkeuren)'},{k:'actief',l:'Actief',type:'bool'}];
  const bedSave=(id,b)=>formSheet(id?'Bedrijf aanpassen':'Nieuw bedrijf',bedVelden,b||{soort:'aannemer',land:'NL',actief:true},async f=>{ await doe({action:'bedrijf_save', id, fields:f},'Bedrijf opgeslagen: '+f.naam); });
  app.querySelectorAll('tr[data-bedrijf]').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('button')) return; bedSave(+tr.dataset.bedrijf,S.data.bedrijven.find(b=>b.id===+tr.dataset.bedrijf)); });
  app.querySelectorAll('[data-logo]').forEach(b=>b.onclick=()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/png,image/jpeg,image/svg+xml,image/webp'; inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; if(f.size>2*1024*1024){ toast('Logo groter dan 2 MB'); return; } const fr=new FileReader(); fr.onload=async()=>{ await doe({action:'bedrijf_logo', id:+b.dataset.logo, fields:{logo_b64:fr.result}},'Logo geplaatst'); toast('Logo geplaatst'); }; fr.readAsDataURL(f); }; inp.click(); });
  const bn=document.getElementById('bd-nieuw'); if(bn) bn.onclick=()=>bedSave(null,null);
  const ie=document.getElementById('i-export'); if(ie) ie.onclick=()=>{ const d=S.data; download('werkbonnen-export-'+vandaagISO()+'.json', JSON.stringify({geexporteerd:new Date().toISOString(), bedrijven:d.bedrijven, projecten:d.projecten, tarieven:d.tarieven, bonnen:d.bonnen, regels:d.regels, facturen:d.facturen, instellingen:d.instellingen}, null, 2), 'application/json'); };
  const iw=document.getElementById('i-wis'); if(iw) iw.onclick=()=>vraag('Typ WISSEN om alle bonnen, regels en facturen te verwijderen (bedrijven, projecten, tarieven en instellingen blijven staan)','',async v=>{ if(v!=='WISSEN'){ toast('Niet gewist'); return; } if(await doe({action:'testdata_wissen', bevestiging:v},'Alle bonnen en facturen gewist')) toast('Testdata gewist'); });
  const io=document.getElementById('i-opslaan'); if(io) io.onclick=()=>doe({action:'instelling_save', instellingen:{factuur_prefix:document.getElementById('i-prefix').value.trim(), factuur_volgnummer:document.getElementById('i-volg').value, betaaltermijn_dagen:document.getElementById('i-termijn').value, btw_pct:document.getElementById('i-btw').value}},'Instellingen opgeslagen');
}

document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState!=='visible'||!S.data||S.tab==='bon') return; try{ await laad(); render(); }catch(e){} });
/* ---------- start ---------- */
(async function start(){
  const m=location.hash.match(/^#([^\/]+)(?:\/(.+))?$/);
  if(m){ S.code=decodeURIComponent(m[1]); if(m[2]) S.wie=decodeURIComponent(m[2]); }
  if(S.code&&S.wie){ try{ await laad(); localStorage.setItem('wb_code',S.code); localStorage.setItem('wb_wie',S.wie); document.getElementById('login').style.display='none'; render(); return; }catch(e){} }
  toonLogin();
})();
</script>
</body>
</html>
